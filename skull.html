<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Black Ghost</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #111 0%, #000 100%);
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  button {
    padding: 14px 30px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #ff003c, #ff8c00, #00ffcc, #ff003c);
    background-size: 300% 100%;
    animation: gradientMove 4s linear infinite;
    color: #000;
    font-weight: bold;
    letter-spacing: 2px;
    cursor: pointer;
    margin-bottom: 35px;
    box-shadow: 0 0 20px rgba(255,0,60,0.4);
  }
  @keyframes gradientMove {
    to { background-position: 300% 0; }
  }
  svg {
    width: 260px;
    height: 260px;
  }
  .stroke-part {
    fill: none;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 2600;
    stroke-dashoffset: 2600;
  }
  #skullOutline { stroke: #ff003c; filter: drop-shadow(0 0 6px #ff003c); }
  #jaw { stroke: #ff003c; filter: drop-shadow(0 0 6px #ff003c); }
  #eyeSocketL, #eyeSocketR { stroke: #00ffcc; filter: drop-shadow(0 0 8px #00ffcc); }
  #nose { stroke: #ffcc00; }
  #teeth { stroke: #ff003c; }
  #crack1, #crack2 { stroke: #666; stroke-width: 1; }

  .drawn {
    animation: draw 1.8s ease forwards;
  }
  #skullOutline.drawn, #jaw.drawn {
    animation: draw 1.8s ease forwards, fillSkull 0.5s ease 1.8s forwards;
  }
  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }
  @keyframes fillSkull {
    to { fill: #0a0a0a; }
  }

  .eyeGlow {
    opacity: 0;
    fill: #00ffcc;
    filter: drop-shadow(0 0 15px #00ffcc);
  }
  .eyeGlow.show {
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.9; }
    50% { opacity: 0.4; }
  }

  #label {
    margin-top: 25px;
    font-size: 32px;
    letter-spacing: 8px;
    font-weight: bold;
    opacity: 0;
    background: linear-gradient(90deg, #ff003c, #ffcc00, #00ffcc, #ff003c);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #label.show {
    animation: fadeIn 1s ease forwards, gradientMove 3s linear infinite;
  }
  @keyframes fadeIn {
    to { opacity: 1; }
  }
</style>
</head>
<body>

  <button onclick="drawSkull()">EXECUTE ▶</button>

  <svg viewBox="0 0 100 110">
    <!-- کاسه سر -->
    <path id="skullOutline" class="stroke-part" d="M50,6
      C28,6 16,22 16,40
      C16,52 20,60 26,66
      L26,72 L74,72 L74,66
      C80,60 84,52 84,40
      C84,22 72,6 50,6 Z"/>

    <!-- فک -->
    <path id="jaw" class="stroke-part" d="M26,72
      C26,80 30,88 38,92
      L38,84 L44,84 L44,92
      L50,92 L50,84 L56,84 L56,92
      L62,92
      C70,88 74,80 74,72"/>

    <!-- حفره چشم چپ -->
    <path id="eyeSocketL" class="stroke-part" d="M25,38
      C25,30 32,26 38,28
      C44,30 44,42 38,46
      C32,50 25,46 25,38 Z"/>

    <!-- حفره چشم راست -->
    <path id="eyeSocketR" class="stroke-part" d="M75,38
      C75,30 68,26 62,28
      C56,30 56,42 62,46
      C68,50 75,46 75,38 Z"/>

    <!-- درخشش داخل چشم‌ها -->
    <circle class="eyeGlow" id="glowL" cx="33" cy="37" r="5"/>
    <circle class="eyeGlow" id="glowR" cx="67" cy="37" r="5"/>

    <!-- حفره بینی -->
    <path id="nose" class="stroke-part" d="M50,48 L44,60 L50,63 L56,60 Z"/>

    <!-- دندان‌ها -->
    <path id="teeth" class="stroke-part" d="M38,72 L38,80
      M44,72 L44,80
      M50,72 L50,80
      M56,72 L56,80
      M62,72 L62,80
      M32,72 L68,72"/>

    <!-- ترک‌های تزئینی -->
    <path id="crack1" class="stroke-part" d="M45,10 L40,20 L44,26"/>
    <path id="crack2" class="stroke-part" d="M78,45 L82,52 L78,58"/>
  </svg>

  <div id="label">BLACK GHOST</div>

  <script>
    function drawSkull() {
      const parts = ['skullOutline','jaw','eyeSocketL','eyeSocketR','nose','teeth','crack1','crack2'];
      parts.forEach(id => {
        const el = document.getElementById(id);
        el.classList.remove('drawn');
        void el.offsetWidth;
        el.classList.add('drawn');
      });

      const glowL = document.getElementById('glowL');
      const glowR = document.getElementById('glowR');
      [glowL, glowR].forEach(el => {
        el.classList.remove('show');
        void el.offsetWidth;
      });
      setTimeout(() => {
        glowL.classList.add('show');
        glowR.classList.add('show');
      }, 1600);

      const label = document.getElementById('label');
      label.classList.remove('show');
      void label.offsetWidth;
      setTimeout(() => label.classList.add('show'), 2000);
    }
  </script>

</body>
</html>
